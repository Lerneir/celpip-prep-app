<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#111827; font-family:sans-serif;">
  <defs>
    <linearGradient id="skyGrad_sc_063" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="terrainGrad_sc_063" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.3" />
    </linearGradient>
    <filter id="shadow_sc_063" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect x="0" y="0" width="800" height="500" fill="url(#skyGrad_sc_063)" />

  <!-- Sun / Ambient Glow -->
  <circle cx="700" cy="80" r="60" fill="#f59e0b" opacity="0.25" />

  <!-- Background Buildings / Structures -->
  <rect x="40" y="110" width="180" height="210" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2" opacity="0.85" />
  <rect x="70" y="140" width="35" height="45" fill="#38bdf8" opacity="0.6" />
  <rect x="150" y="140" width="35" height="45" fill="#38bdf8" opacity="0.6" />
  <rect x="70" y="210" width="35" height="45" fill="#f59e0b" opacity="0.6" />
  <rect x="150" y="210" width="35" height="45" fill="#38bdf8" opacity="0.6" />

  <rect x="540" y="90" width="220" height="230" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="2" opacity="0.85" />
  <rect x="570" y="120" width="45" height="35" fill="#4ade80" opacity="0.7" />
  <rect x="680" y="120" width="45" height="35" fill="#38bdf8" opacity="0.7" />

  <!-- Ground / Floor -->
  <path d="M0 290 Q 400 270 800 290 L 800 500 L 0 500 Z" fill="url(#terrainGrad_sc_063)" />

  <!-- Banner Signboard -->
  <rect x="220" y="30" width="360" height="50" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#shadow_sc_063)" />
  <text x="400" y="56" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">CELPIP SCENARIO #63: INDOOR ROCK CLIMBING WALL</text>
  <text x="400" y="74" fill="#f59e0b" font-size="12" font-weight="600" text-anchor="middle">Category: Workplace</text>

  <!-- MIDGROUND CHARACTERS & ACTIONS -->
  <!-- Character 1 (Left - Action) -->
  <g transform="translate(140, 280)" filter="url(#shadow_sc_063)">
    <circle cx="20" cy="20" r="14" fill="#fde047" />
    <rect x="10" y="34" width="20" height="45" rx="6" fill="#3b82f6" />
    <line x1="5" y1="40" x2="35" y2="40" stroke="#fde047" stroke-width="6" stroke-linecap="round" />
    <line x1="15" y1="79" x2="10" y2="110" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    <line x1="25" y1="79" x2="30" y2="110" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    <rect x="-40" y="-15" width="120" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="1" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">1. Person Preparing Item</text>
  </g>

  <!-- Character 2 (Center - Main Focal Point) -->
  <g transform="translate(380, 260)" filter="url(#shadow_sc_063)">
    <circle cx="20" cy="20" r="16" fill="#f87171" />
    <rect x="8" y="36" width="24" height="50" rx="6" fill="#10b981" />
    <path d="M 0 45 Q -20 30 -30 45" stroke="#f87171" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 40 45 Q 60 30 70 45" stroke="#f87171" stroke-width="6" fill="none" stroke-linecap="round"/>
    <line x1="14" y1="86" x2="8" y2="125" stroke="#1e293b" stroke-width="7" stroke-linecap="round" />
    <line x1="26" y1="86" x2="32" y2="125" stroke="#1e293b" stroke-width="7" stroke-linecap="round" />
    <rect x="-45" y="-18" width="130" height="24" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="20" y="-2" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle">2. Main Action / Activity</text>
  </g>

  <!-- Character 3 (Right - Assistant / Observer) -->
  <g transform="translate(620, 290)" filter="url(#shadow_sc_063)">
    <circle cx="20" cy="20" r="14" fill="#a78bfa" />
    <rect x="10" y="34" width="20" height="45" rx="6" fill="#ec4899" />
    <line x1="15" y1="79" x2="12" y2="110" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    <line x1="25" y1="79" x2="28" y2="110" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    <rect x="-35" y="-15" width="110" height="24" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="20" y="1" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">3. Assistant / Observer</text>
  </g>

  <!-- FOREGROUND OBJECTS -->
  <g transform="translate(240, 400)">
    <rect x="0" y="0" width="90" height="45" rx="8" fill="#334155" stroke="#f59e0b" stroke-width="2" />
    <text x="45" y="26" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle">Equipment / Cart</text>
  </g>

  <g transform="translate(490, 410)">
    <circle cx="25" cy="20" r="18" fill="#e11d48" opacity="0.85" />
    <text x="25" y="24" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">Object</text>
  </g>

  <!-- SPATIAL COMPASS CUES OVERLAY -->
  <g transform="translate(20, 435)" opacity="0.8">
    <rect x="0" y="0" width="150" height="45" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="75" y="18" fill="#94a3b8" font-size="10" text-anchor="middle">📍 Spatial Locations:</text>
    <text x="75" y="34" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">Foreground • Left • Background • Right</text>
  </g>
</svg>