<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#311b92; font-family:sans-serif;">
  <defs>
    <linearGradient id="skyGrad_sc_074" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a148c" />
      <stop offset="100%" stop-color="#311b92" />
    </linearGradient>
    <linearGradient id="terrainGrad_sc_074" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.3" />
    </linearGradient>
    <filter id="shadow_sc_074" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect x="0" y="0" width="800" height="500" fill="url(#skyGrad_sc_074)" />

  <!-- Sun / Ambient Glow -->
  <circle cx="700" cy="80" r="60" fill="#e879f9" opacity="0.25" />

  <!-- Background Structures / Buildings -->
  <rect x="50" y="120" width="160" height="200" rx="8" fill="#1e293b" stroke="#e879f9" stroke-width="2" opacity="0.8" />
  <rect x="80" y="150" width="30" height="40" fill="#38bdf8" opacity="0.6" />
  <rect x="140" y="150" width="30" height="40" fill="#38bdf8" opacity="0.6" />
  <rect x="80" y="210" width="30" height="40" fill="#f59e0b" opacity="0.6" />
  <rect x="140" y="210" width="30" height="40" fill="#38bdf8" opacity="0.6" />

  <rect x="550" y="100" width="200" height="220" rx="8" fill="#0f172a" stroke="#e879f9" stroke-width="2" opacity="0.8" />
  <rect x="580" y="130" width="40" height="30" fill="#4ade80" opacity="0.7" />
  <rect x="680" y="130" width="40" height="30" fill="#38bdf8" opacity="0.7" />

  <!-- Ground / Floor -->
  <path d="M0 300 Q 400 280 800 300 L 800 500 L 0 500 Z" fill="url(#terrainGrad_sc_074)" />

  <!-- Spatial Zone Grid / Signboards -->
  <rect x="260" y="40" width="280" height="45" rx="10" fill="#1e293b" stroke="#e879f9" stroke-width="2" filter="url(#shadow_sc_074)" />
  <text x="400" y="68" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">CELPIP SCENARIO #74: MINI GOLF COURSE</text>
  <text x="400" y="100" fill="#e879f9" font-size="13" font-weight="600" text-anchor="middle">Category: Social & Events</text>

  <!-- MIDGROUND CHARACTERS & ACTIONS -->
  <!-- Character 1 (Left - Action) -->
  <g transform="translate(140, 290)" filter="url(#shadow_sc_074)">
    <circle cx="20" cy="20" r="14" fill="#fde047" />
    <rect x="10" y="34" width="20" height="45" rx="6" fill="#3b82f6" />
    <line x1="5" y1="40" x2="35" y2="40" stroke="#fde047" stroke-width="6" stroke-linecap="round" />
    <line x1="15" y1="79" x2="10" y2="110" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    <line x1="25" y1="79" x2="30" y2="110" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    <rect x="-40" y="-15" width="120" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="1" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">1. Person Preparing Item</text>
  </g>

  <!-- Character 2 (Center - Main Focal Point) -->
  <g transform="translate(380, 270)" filter="url(#shadow_sc_074)">
    <circle cx="20" cy="20" r="16" fill="#f87171" />
    <rect x="8" y="36" width="24" height="50" rx="6" fill="#10b981" />
    <!-- Arms reaching forward -->
    <path d="M 0 45 Q -20 30 -30 45" stroke="#f87171" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 40 45 Q 60 30 70 45" stroke="#f87171" stroke-width="6" fill="none" stroke-linecap="round"/>
    <line x1="14" y1="86" x2="8" y2="125" stroke="#1e293b" stroke-width="7" stroke-linecap="round" />
    <line x1="26" y1="86" x2="32" y2="125" stroke="#1e293b" stroke-width="7" stroke-linecap="round" />
    <rect x="-45" y="-18" width="130" height="24" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="20" y="-2" fill="#4ade80" font-size="11" font-weight="bold" text-anchor="middle">2. Main Action / Interaction</text>
  </g>

  <!-- Character 3 (Right - Staff / Secondary) -->
  <g transform="translate(620, 300)" filter="url(#shadow_sc_074)">
    <circle cx="20" cy="20" r="14" fill="#a78bfa" />
    <rect x="10" y="34" width="20" height="45" rx="6" fill="#ec4899" />
    <line x1="15" y1="79" x2="12" y2="110" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    <line x1="25" y1="79" x2="28" y2="110" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
    <rect x="-35" y="-15" width="110" height="24" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="20" y="1" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">3. Assistant / Observer</text>
  </g>

  <!-- FOREGROUND OBJECTS FOR DETAIL DESCRIPTION -->
  <g transform="translate(240, 410)">
    <rect x="0" y="0" width="80" height="45" rx="8" fill="#334155" stroke="#f59e0b" stroke-width="2" />
    <text x="40" y="26" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="middle">Equipment / Cart</text>
  </g>

  <g transform="translate(480, 420)">
    <circle cx="25" cy="20" r="18" fill="#e11d48" opacity="0.8" />
    <text x="25" y="24" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">Object</text>
  </g>

  <!-- SPATIAL COMPASS CUES (Helpful CELPIP reference overlay) -->
  <g transform="translate(20, 440)" opacity="0.7">
    <rect x="0" y="0" width="140" height="45" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="70" y="18" fill="#94a3b8" font-size="10" text-anchor="middle">📍 Spatial Locations:</text>
    <text x="70" y="34" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">Foreground • Left • Background • Right</text>
  </g>
</svg>